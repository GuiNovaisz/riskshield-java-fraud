name: RiskShield verification
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Unit, authorization, golden, real infrastructure and concurrency proofs
        run: bash mvnw -B -ntp clean verify dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
      - name: Reproducible evaluation and delayed-label isolation
        shell: bash
        run: |
          CP="target/classes:$(cat target/classpath.txt)"
          AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          java -Dapplication.commit="$GITHUB_SHA" -Devaluation.at="$AT" -cp "$CP" io.riskshield.evaluation.EvaluationMain 20261121 target/eval-a
          java -Dapplication.commit="$GITHUB_SHA" -Devaluation.at="$AT" -cp "$CP" io.riskshield.evaluation.EvaluationMain 20261121 target/eval-b
          diff target/eval-a/evaluation.json target/eval-b/evaluation.json
          diff target/eval-a/dataset.jsonl target/eval-b/dataset.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/eval-a
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Clean build/start and authenticated duplicate smoke
        shell: pwsh
        run: |
          ./scripts/dev-up.ps1 -Build
          ./scripts/smoke.ps1
      - name: Load correctness and bounded baseline
        shell: pwsh
        run: |
          ./scripts/load-test.ps1 -Scenario steady
          ./scripts/load-test.ps1 -Scenario duplicate
          ./scripts/load-test.ps1 -Scenario velocity
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: load-evidence, path: work/load}
      - name: Remove this job's stack
        if: always()
        run: docker compose down -v
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
