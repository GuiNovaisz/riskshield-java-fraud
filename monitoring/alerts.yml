groups:
  - name: riskshield-demo
    rules:
      - alert: DecisionLatencyElevated
        expr: histogram_quantile(0.95, sum by(le)(rate(risk_stage_seconds_bucket{stage="total"}[5m]))) > 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Demo threshold: decision engine p95 exceeds one second"}
      - alert: DegradedDecisionSpike
        expr: sum(rate(risk_degraded_decisions_total[5m])) / clamp_min(sum(rate(risk_decisions_total[5m])), 0.001) > 0.1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Demo threshold: more than ten percent degraded"}
      - alert: VelocityStoreErrors
        expr: sum(rate(risk_velocity_errors_total[1m])) > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Velocity store unavailable or capacity exceeded"}
      - alert: DecisionErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Demo threshold: server error rate"}
      - alert: UnusualBlockRate
        expr: sum(rate(risk_decisions_total{decision="BLOCK"}[5m])) / clamp_min(sum(rate(risk_decisions_total[5m])), 0.001) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Demo threshold: more than half blocked; inspect policy and traffic"}
